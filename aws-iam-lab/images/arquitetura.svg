<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D13212"/>
    </marker>
    <!-- glifos reutilizáveis -->
    <g id="person"><circle cx="0" cy="-14" r="13" fill="none" stroke-width="5"/><path d="M-26,26 C-26,2 26,2 26,26" fill="none" stroke-width="5"/></g>
    <g id="doc">
      <path d="M-20,-28 H8 L22,-14 V28 H-20 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M8,-28 V-14 H22" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-11,-6 H13 M-11,4 H13 M-11,14 H5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="2" y="2" width="1196" height="656" rx="22" fill="#FFFFFF" stroke="#E3E6EA" stroke-width="2"/>

  <!-- Título -->
  <text x="40" y="52" font-size="24" font-weight="700" fill="#232F3E">Lab IAM — Grupo SupportEngineers com privilégio mínimo</text>

  <!-- Engenheiro (ator externo) -->
  <rect x="48" y="268" width="92" height="92" rx="10" fill="#E9EBED"/>
  <use href="#person" transform="translate(94,318) scale(1.1)" stroke="#232F3E"/>
  <text x="94" y="388" font-size="17" text-anchor="middle" fill="#232F3E">Engenheiro</text>
  <text x="94" y="408" font-size="17" text-anchor="middle" fill="#232F3E">de suporte</text>
  <path d="M140,314 H296" stroke="#232F3E" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="182" y="302" font-size="13" text-anchor="middle" fill="#545B64">login</text>

  <!-- AWS Cloud -->
  <rect x="226" y="80" width="944" height="552" rx="6" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <rect x="226" y="80" width="34" height="30" fill="#232F3E"/>
  <path d="M236,100 a6,6 0 0 1 4,-10 a8,8 0 0 1 14,3 a5,5 0 0 1 -1,7 z" fill="#fff"/>
  <text x="270" y="101" font-size="15" fill="#232F3E">AWS Cloud</text>

  <!-- IAM (serviço global) -->
  <rect x="264" y="126" width="456" height="482" rx="6" fill="none" stroke="#DD344C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="264" y="126" width="30" height="28" fill="#DD344C"/>
  <rect x="273" y="136" width="12" height="11" rx="1" fill="#fff"/><path d="M275,136 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="302" y="146" font-size="15" fill="#DD344C">AWS IAM (global)</text>

  <!-- Grupo -->
  <rect x="300" y="176" width="384" height="232" rx="8" fill="#FDF3F5" stroke="#E7849A" stroke-width="2.5"/>
  <text x="318" y="204" font-size="15" font-weight="700" fill="#232F3E">IAM User Group</text>
  <rect x="448" y="188" width="150" height="24" rx="12" fill="#545B64"/>
  <text x="523" y="205" font-size="13" text-anchor="middle" fill="#fff">SupportEngineers</text>

  <!-- Users -->
  <rect x="345" y="236" width="92" height="92" rx="10" fill="#DD344C"/>
  <use href="#person" transform="translate(378,288) scale(0.8)" stroke="#fff"/>
  <use href="#person" transform="translate(406,284) scale(0.8)" stroke="#fff"/>
  <text x="391" y="354" font-size="16" text-anchor="middle" fill="#232F3E">Users</text>

  <!-- support-engineer-1 -->
  <rect x="535" y="236" width="92" height="92" rx="10" fill="#DD344C"/>
  <use href="#person" transform="translate(581,286)" stroke="#fff"/>
  <text x="581" y="354" font-size="16" text-anchor="middle" fill="#232F3E">support-</text>
  <text x="581" y="374" font-size="16" text-anchor="middle" fill="#232F3E">engineer-1</text>

  <!-- Políticas -->
  <rect x="345" y="452" width="92" height="92" rx="10" fill="#DD344C"/>
  <use href="#doc" transform="translate(391,498)"/>
  <text x="391" y="568" font-size="15" text-anchor="middle" fill="#232F3E">AmazonEC2</text>
  <text x="391" y="586" font-size="15" text-anchor="middle" fill="#232F3E">ReadOnlyAccess</text>

  <rect x="535" y="452" width="92" height="92" rx="10" fill="#DD344C"/>
  <use href="#doc" transform="translate(581,498)"/>
  <text x="581" y="568" font-size="15" text-anchor="middle" fill="#232F3E">AmazonRDS</text>
  <text x="581" y="586" font-size="15" text-anchor="middle" fill="#232F3E">ReadOnlyAccess</text>

  <path d="M391,452 V412" stroke="#232F3E" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M581,452 V412" stroke="#232F3E" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="486" y="436" font-size="13" text-anchor="middle" fill="#545B64">anexadas ao grupo</text>

  <!-- Região -->
  <rect x="782" y="126" width="360" height="482" rx="6" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="782" y="126" width="30" height="28" fill="#147EBA"/>
  <path d="M792,148 V134 M792,134 h12 l-3,4 l3,4 h-12" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="820" y="146" font-size="15" fill="#147EBA">us-east-1 (Norte da Virgínia)</text>

  <!-- EC2 -->
  <rect x="916" y="186" width="92" height="92" rx="10" fill="#ED7100"/>
  <rect x="940" y="210" width="44" height="44" rx="3" fill="none" stroke="#fff" stroke-width="4"/>
  <rect x="952" y="222" width="20" height="20" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M948,202 v8 M962,202 v8 M976,202 v8 M948,254 v8 M962,254 v8 M976,254 v8 M932,218 h8 M932,232 h8 M932,246 h8 M984,218 h8 M984,232 h8 M984,246 h8" stroke="#fff" stroke-width="3"/>
  <text x="962" y="304" font-size="16" text-anchor="middle" fill="#232F3E">Amazon EC2</text>

  <!-- RDS -->
  <rect x="916" y="380" width="92" height="92" rx="10" fill="#C925D1"/>
  <ellipse cx="962" cy="404" rx="24" ry="8" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M938,404 V446 A24,8 0 0 0 986,446 V404 M938,418 A24,8 0 0 0 986,418 M938,432 A24,8 0 0 0 986,432" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="962" y="498" font-size="16" text-anchor="middle" fill="#232F3E">Amazon RDS</text>

  <!-- Acesso de leitura -->
  <path d="M684,262 H800 V232 H912" fill="none" stroke="#232F3E" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M684,322 H800 V426 H912" fill="none" stroke="#232F3E" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="862" y="252" font-size="13" text-anchor="middle" fill="#1D8102">✔ Describe / List</text>
  <text x="862" y="446" font-size="13" text-anchor="middle" fill="#1D8102">✔ Describe / List</text>

  <!-- Legenda -->
  <rect x="810" y="546" width="304" height="46" rx="6" fill="#F7F8F8" stroke="#E3E6EA"/>
  <text x="826" y="566" font-size="13" fill="#1D8102">✔ Leitura permitida</text>
  <text x="826" y="584" font-size="13" fill="#D13212">✖ Create / Modify / Stop / Delete negado</text>
</svg>
